name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Gestionale Intenzioni Messe ${{ github.ref_name }}"
          releaseBody: |
            In questa versione sono stati migliorati il controllo degli aggiornamenti e la stampa dei promemoria.

            Cosa cambia:
            - messaggio di aggiornamento piu chiaro, senza dettagli tecnici;
            - promemoria per stampantina 80 mm piu compatto, con margini corretti;
            - controllo dei dati prima del salvataggio, cosi ogni messa ha data, ora e persona ricordata;
            - anteprima del promemoria prima del salvataggio definitivo, con possibilita di tornare indietro e correggere.

            Per aggiornare, apri il gestionale e premi "Controlla aggiornamenti", poi "Scarica il nuovo aggiornamento".
          releaseDraft: false
          prerelease: false
